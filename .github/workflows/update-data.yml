name: Update chain data

on:
  schedule:
    # GitHub Actions minimum is every 5 minutes — we update as fast as allowed
    - cron: '*/5 * * * *'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  actions: write   # needed to trigger other workflows

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch chain data and write data.json
        run: |
          node - <<'EOF'
          const RPC = "https://rpc.mainnet.chain.robinhood.com";
          const fs  = require("fs");

          async function rpc(method, params = []) {
            const r = await fetch(RPC, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
              signal: AbortSignal.timeout(8000),
            });
            const j = await r.json();
            if (j.error) throw new Error(j.error.message);
            return j.result;
          }

          const hex = v => parseInt(v, 16);

          (async () => {
            try {
              // Ping
              const t0 = Date.now();
              const blockHex = await rpc("eth_blockNumber");
              const latencyMs = Date.now() - t0;
              const blockNumber = hex(blockHex);
              const level = latencyMs < 150 ? "fast" : latencyMs < 500 ? "normal" : latencyMs < 1500 ? "slow" : "down";

              // Fetch 20 blocks for stats
              const raw = await Promise.all(
                Array.from({ length: 20 }, (_, i) =>
                  rpc("eth_getBlockByNumber", [`0x${(blockNumber - i).toString(16)}`, true])
                )
              );
              const blocks = raw.filter(Boolean);

              const wallets = new Set();
              let totalTx = 0, deploys = 0;
              for (const b of blocks) {
                const txs = b.transactions || [];
                totalTx += txs.length;
                for (const tx of txs) {
                  if (tx.from) wallets.add(tx.from.toLowerCase());
                  if (!tx.to || tx.to === "") deploys++;
                }
              }

              const timestamps = blocks.map(b => hex(b.timestamp)).sort((a, b) => b - a);
              const spanSec = timestamps.length > 1 ? timestamps[0] - timestamps[timestamps.length - 1] : 0;
              const effectiveSpan = spanSec >= 5 ? spanSec : blocks.length * 0.1;
              const txPerMin = effectiveSpan > 0 ? Math.round((totalTx / effectiveSpan) * 60) : 0;

              const blockTimeSamples = [];
              for (let i = 0; i < blocks.length - 1; i++) {
                const tDiff = hex(blocks[i].timestamp) - hex(blocks[i+1].timestamp);
                const nDiff = hex(blocks[i].number) - hex(blocks[i+1].number);
                if (tDiff > 0 && nDiff > 0) blockTimeSamples.push(tDiff / nDiff);
              }
              const avgBlockTimeSec = blockTimeSamples.length > 0
                ? Math.round(blockTimeSamples.reduce((a,b) => a+b, 0) / blockTimeSamples.length * 1000) / 1000
                : 0.1;

              const latest = blocks[0];
              const baseFeeGwei = latest?.baseFeePerGas
                ? Math.round(hex(latest.baseFeePerGas) / 1e9 * 10000) / 10000 : 0;

              const data = {
                rpc: { latencyMs, blockNumber, level, endpoint: RPC },
                chain: { id: 4663, name: "Robinhood Chain", stack: "Arbitrum Orbit" },
                stats: {
                  txPerMin,
                  activeWallets: wallets.size,
                  contractDeploys: deploys,
                  avgTxPerBlock: blocks.length > 0 ? Math.round(totalTx / blocks.length) : 0,
                  avgBlockTimeSec,
                  baseFeeGwei,
                  windowBlocks: blocks.length,
                },
                timestamp: new Date().toISOString(),
                note: "Updated every 5 minutes via GitHub Actions. For real-time data call the RPC directly.",
              };

              fs.writeFileSync("public/data.json", JSON.stringify(data, null, 2));
              console.log("Written public/data.json — block", blockNumber, "latency", latencyMs + "ms");
            } catch (e) {
              console.error("Error:", e.message);
              process.exit(1);
            }
          })();
          EOF

      - name: Commit data.json if changed and trigger deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --cached --quiet; then
            echo "No changes to data.json"
          else
            git commit -m "chore: update chain data [skip ci]"
            git push
            # Trigger the Pages deploy workflow explicitly
            gh workflow run deploy.yml --ref main
            echo "Triggered deploy workflow"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
